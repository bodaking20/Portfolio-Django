{% extends 'base.html' %}
{% block content %}
<section class="fade-in py-14">
  <a href="{% url 'scripts_list' %}" class="mono text-sm text-[var(--text-dim)] hover:text-[var(--accent)] mb-6 inline-block">&larr; back to scripts</a>
  <div class="grid md:grid-cols-2 gap-10">
    {% if script.image %}
    <img src="{{ script.image.url }}" alt="{{ script.title }}" class="w-full rounded-xl border border-[var(--border)] object-cover">
    {% endif %}
    <div>
      <h2 class="text-3xl font-bold mono mb-3">{{ script.title }}</h2>
      <p class="text-[var(--accent)] mono text-lg mb-5">{{ script.price }}</p>
      <p class="text-[var(--text-dim)] leading-relaxed mb-8">{{ script.description }}</p>
      
      <div class="win">
        <div class="win-bar">
          <span class="dot" style="background:#FF5F57"></span>
          <span class="dot" style="background:#FFBD2E"></span>
          <span class="dot" style="background:#28C840"></span>
          <span class="mono text-xs text-[var(--text-mute)] ml-2">request_subscription.py</span>
        </div>
        <form class="p-6" method="POST">
          {% csrf_token %}
          <label class="block mono text-xs text-[var(--text-dim)] mb-2">Phone Number or Facebook Link</label>
          <input type="text" name="contact_info" required placeholder="+20 1xx xxx xxxx or fb.com/you" class="w-full rounded-md px-4 py-3 mb-5 text-sm">
          <button type="submit" class="btn-primary mono w-full py-3 rounded-md text-sm">Request Subscription</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
